[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "decision-harness"
version = "0.8.0"
description = "Typed judgments through TypeSafe, OpenAI Decisions, and Cloudflare Clef, with CLI and MCP"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk==0.7.5",
    "mcp==2.3.0",
    "openai==3.49.0",
    "httpx2==2.16.0",
]

[project.scripts]
decision = "decision_cli.cli:main"

[dependency-groups]
build = ["pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_cli"]

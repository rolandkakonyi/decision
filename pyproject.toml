[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "decision-harness"
version = "0.3.0"
description = "Typed System One judgments through one CLI and MCP executable"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk==0.7.5", "mcp==2.3.0"]

[project.scripts]
decision = "decision_cli.cli:main"

[dependency-groups]
build = ["pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_cli"]
